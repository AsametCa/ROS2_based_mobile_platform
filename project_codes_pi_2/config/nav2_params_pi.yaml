# ==============================================================================
# @file nav2_params_pi.yaml
# @brief Nav2 navigation stack configuration optimized for Raspberry Pi 4 (2 GB).
#
# Performance Optimizations for Embedded SBC:
# - Reduced AMCL particle filter boundaries (max: 1500, min: 200) to lower RAM & CPU.
# - Downscaled laser beams (max_beams: 40) for expedited likelihood field matching.
# - Adjusted controller frequency to 5.0 Hz to prevent missed control loops.
# - Reduced DWB trajectory generator sample counts (vx: 6, vtheta: 6).
# - Decreased local costmap update rate to 3.0 Hz and global costmap to 1.0 Hz.
# ==============================================================================

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel

    # Initial pose estimate is omitted; global localization is invoked automatically
    set_initial_pose: false

    # Particle Filter Bounds (Optimized for indoor environments on Raspberry Pi)
    max_particles: 1500
    min_particles: 200

    # Motion model odometry noise covariance parameters
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Laser sensor model parameters
    laser_max_range: 12.0
    laser_min_range: 0.15
    max_beams: 40                     # Subsampled beam count to reduce raycasting workload
    laser_model_type: likelihood_field

    # Filter update thresholds
    update_min_a: 0.15
    update_min_d: 0.15
    resample_interval: 1

    tf_broadcast: true
    transform_tolerance: 1.0

    # Recovery parameters for beam likelihood divergence
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1

controller_server:
  ros__parameters:
    use_sim_time: false
    # Output unstamped Twist messages matching twist_mux input specifications
    enable_stamped_cmd_vel: false
    # Tuned execution rate to maintain consistent loop times without CPU throttling
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: 0.0
      max_vel_x: 0.36
      max_vel_theta: 1.5
      min_speed_xy: 0.0
      max_speed_xy: 0.36
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.0
      decel_lim_theta: -2.0
      # Subsampled velocity trajectory space to reduce trajectory scoring overhead
      vx_samples: 6
      vtheta_samples: 6
      sim_time: 1.0
      transform_tolerance: 0.2
      critics: [RotateToGoal, Oscillation, ObstacleFootprint, GoalAlign, PathAlign, PathDist, GoalDist]

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.18
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          clearing: true
          marking: true
          data_type: LaserScan
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.35

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      robot_radius: 0.18
      resolution: 0.05
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          clearing: true
          marking: true
          data_type: LaserScan
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
